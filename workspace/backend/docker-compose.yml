services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: caeru_app
      POSTGRES_USER: caeru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - caeru-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caeru -d caeru_app']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  caeru-postgres:
